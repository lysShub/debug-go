name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.18.x"
          cache: true

      - run: go install golang.org/x/tools/cmd/goimports@v0.14.0
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.3.3
      - run: go mod tidy
      - run: staticcheck ./...
      - run: staticcheck -tags debug ./...
      - run: goimports -w .
      - run: go fmt ./...
      - run: go vet ./...
      - run: go vet -tags debug ./...
      - run: go test ./...
      - run: go test -tags debug ./...
      - run: git diff --exit-code
